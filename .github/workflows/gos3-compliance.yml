name: GOS3 Compliance

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gos3-compliance:
    name: GOS3 compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm install

      - name: Gate 1 - Contract (comportamento)
        run: python3 tests/contract_test.py
        # processo -> stdout/stderr/exit_code/duration_ms -> evidence_hash -> comparação
        # executed:true só é aceito se a evidência fechar.

      - name: Gate 2 - Runtime and orchestration tests
        run: |
          npm run test:runtime-loop
          npm run test:orchestrator
          npm run test:grok

      - name: Gate 3 - Validate repository truth
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          echo "== GOS3 Compliance =="
          echo

          test -f spec/invocation-contract.md \
            || fail "spec/invocation-contract.md missing"

          grep -Eq "(Status:|fase:).*Technical Refinement" \
            spec/invocation-contract.md \
            || fail "invocation contract classification changed unexpectedly"

          test -f docs/agents/gpt/TRUTH-MATRIX.md \
            || fail "GPT truth matrix missing"

          test -f src/agents/gpt/adapter/index.ts \
            || fail "GPT adapter missing"

          grep -q "runtime executor supplied by the host" \
            src/agents/gpt/adapter/index.ts \
            || fail "GPT adapter is not evidence-gated"

          grep -q "GPT adapter is NOT IMPLEMENTED in Vortex" \
            docs/agents/gpt/TRUTH-MATRIX.md \
            && fail "GPT truth matrix still says NOT IMPLEMENTED while adapter exists"

          test -f docs/PRODUCT-TRUTH.md \
            || fail "docs/PRODUCT-TRUTH.md missing"

          grep -q "49/49 coverage.*NOT CLAIMED" \
            docs/PRODUCT-TRUTH.md \
            || fail "49/49 coverage is not explicitly marked NOT CLAIMED"

          grep -q "GPT runtime is operational in Vortex.*NOT PROVEN" \
            docs/PRODUCT-TRUTH.md \
            || fail "GPT runtime truth classification is not conservative"

          grep -q "IMPLEMENTED / EXECUTION UNPROVEN" \
            docs/PRODUCT-TRUTH.md \
            || fail "MetaAI execution-unproven classification missing"

          for agent in claude grok manus metaai; do
            test -d "src/agents/$agent" \
              || fail "Expected agent directory missing: $agent"
          done

          if grep -nE '49/49.*IMPLEMENTED|GPT runtime.*IMPLEMENTED|metaai.*REAL EXECUTION' \
              docs/PRODUCT-TRUTH.md; then
            fail "Detected semantic inflation in PRODUCT-TRUTH.md"
          fi

          echo
          echo "GOS3 COMPLIANCE: PASS"
