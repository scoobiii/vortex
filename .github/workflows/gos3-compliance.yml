# GOS3 · agente: agent/llm · papel: Engineering Agent · PO: scoobiii
# fase: Technical Refinement → Governance Enforcement · data: 2026-09-07 · hora: registrada pelo Git
# antes: o workflow aceitava qualquer ocorrência de GOS3 nas primeiras 20 linhas e ignorava headers ausentes em arquivos legados alterados.
# depois: o workflow delega a validação do contrato GOS3 ao checker canônico e falha em qualquer arquivo de texto alterado sem os campos obrigatórios.
# base: commit `feat/rhino-cad-connector`
# assinatura: agent/llm · Engineering Agent · GOS3
# commit: registrado pelo Git no commit que contém esta alteração.

name: gos3-compliance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-headers:
    name: check-headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate GOS3 headers on changed text files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -z "${BASE_SHA:-}" ]]; then
            echo "No base commit available; cannot verify changed files."
            exit 1
          fi
          BASE_SHA="$BASE_SHA" node scripts/governance/check_header.js

  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Governance policy gate
        run: python3 tests/change_validation_policy_test.py
      - name: Gate 1
        run: python3 tests/contract_test.py
