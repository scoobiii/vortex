# GOS3 · agente: GPT · papel: Maintainer / Engineering Agent
# fase: Technical Refinement → VUA + Connector Federation + Real Qwen CI · data: 2026-09-07 · hora: 20:10
# antes: workflow podia ser registrado sem jobs quando a sintaxe de mappings/expressões era rejeitada.
# depois: workflow usa YAML explícito, mantém check-headers obrigatório e permite dispatch manual.
# base: feat/gos3-runtime-orchestration
# assinatura: agent/llm · Engineering Agent · GOS3
# commit: registered by Git
name: GOS3 Compliance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-headers:
    name: check-headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate GOS3 headers on changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          [[ -n "${BASE_SHA:-}" ]] || { echo "No base commit available"; exit 1; }
          mapfile -t files < <(git diff --name-only "$BASE_SHA"...HEAD)
          failures=0
          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue
            case "$file" in
              *.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico|*.zip|*.gz|*.tar|*.pdf|*.woff|*.woff2)
                continue
                ;;
            esac
            if head -n 20 -- "$file" | grep -qE 'GOS3'; then
              echo "PASS: $file"
            else
              echo "FAIL: missing GOS3 header: $file"
              failures=$((failures + 1))
            fi
          done
          (( failures == 0 )) || exit 1
          echo "check-headers: PASS"

  contract-gate:
    name: GOS3 compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Governance policy gate
        run: python3 tests/change_validation_policy_test.py

      - name: Contract gate
        run: python3 tests/contract_test.py

      - name: Runtime and orchestration tests
        run: |
          npm run test:runtime-loop
          npm run test:orchestrator
          npm run test:grok
          npm run test:qwen05b:contract
          npm run test:vua
          npm run test:ollama:contract
          npm run test:github:contract

      - name: Validate repository truth
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          test -f spec/invocation-contract.md || fail "spec/invocation-contract.md missing"
          test -f docs/agents/gpt/TRUTH-MATRIX.md || fail "GPT truth matrix missing"
          test -f src/agents/gpt/adapter/index.ts || fail "GPT adapter missing"
          test -f src/vortex/vua/types.ts || fail "VUA types missing"
          test -f connectors/ollama/install/install.sh || fail "Ollama Linux installer missing"
          test -f connectors/ollama/install/install.ps1 || fail "Ollama Windows installer missing"
          test -f connectors/github/mcp/index.ts || fail "GitHub MCP boundary missing"
          grep -q "49/49 coverage.*NOT CLAIMED" docs/PRODUCT-TRUTH.md || fail "49/49 coverage is not explicitly marked NOT CLAIMED"
          grep -q "GPT runtime is operational in Vortex.*NOT PROVEN" docs/PRODUCT-TRUTH.md || fail "GPT runtime truth classification is not conservative"
          echo "GOS3 COMPLIANCE: PASS"

  qwen-real-e2e:
    name: qwen-real-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          command -v ollama
          ollama --version

      - name: Start Ollama
        shell: bash
        run: |
          set -euo pipefail
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama API: PASS"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull real Qwen 0.5B model
        shell: bash
        run: |
          set -euo pipefail
          ollama pull qwen2.5-coder:0.5b
          ollama list

      - name: Capture Qwen runtime and model provenance
        shell: bash
        run: |
          set -euo pipefail
          runtime_version="$(ollama --version | tr -d '\r')"
          runtime_binary="$(command -v ollama)"
          runtime_digest="sha256:$(sha256sum "$runtime_binary" | awk '{print $1}')"
          modelfile="$(mktemp)"
          ollama show --modelfile qwen2.5-coder:0.5b > "$modelfile"
          model_blob="$(awk '$1 == "FROM" {print $2; exit}' "$modelfile")"
          [[ -n "$model_blob" && -f "$model_blob" ]] || { cat "$modelfile"; exit 1; }
          model_digest="sha256:$(sha256sum "$model_blob" | awk '{print $1}')"
          {
            echo "QWEN_MODEL=qwen2.5-coder:0.5b"
            echo "QWEN_BASE_URL=http://127.0.0.1:11434/v1"
            echo "QWEN_TIMEOUT_MS=120000"
            echo "QWEN_RUNTIME_VERSION=$runtime_version"
            echo "QWEN_RUNTIME_DIGEST=$runtime_digest"
            echo "QWEN_MODEL_DIGEST=$model_digest"
          } >> "$GITHUB_ENV"
          echo "Qwen runtime: $runtime_version"
          echo "Qwen runtime binary digest: $runtime_digest"
          echo "Qwen model blob digest: $model_digest"

      - name: Execute real Qwen E2E
        run: npm run test:qwen05b:e2e

      - name: Upload Qwen execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-real-evidence-${{ github.run_id }}
          path: qwen-evidence.json
          if-no-files-found: error
          retention-days: 14
