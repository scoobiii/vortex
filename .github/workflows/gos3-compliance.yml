# GOS3 · agente: GPT · papel: Maintainer / Engineering Agent
# fase: Technical Refinement → Governance Enforcement · data: 2026-09-05
# antes: o workflow validava headers e contrato, mas não verificava a existência das invariantes do protocolo de mudança.
# depois: o workflow também executa o teste automatizado da política Mexeu → Testa → Valida → Publica.
# base: commit `main`
# assinatura: GPT · Maintainer / Engineering Agent · GOS3

name: gos3-compliance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-headers:
    name: check-headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate GOS3 headers on changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -z "${BASE_SHA:-}" ]]; then
            echo "No base commit available; cannot verify changed files."
            exit 1
          fi

          mapfile -t files < <(git diff --name-only "$BASE_SHA"...HEAD)
          failures=0
          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue
            case "$file" in
              *.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico|*.zip|*.gz|*.tar|*.pdf|*.woff|*.woff2)
                echo "SKIP binary: $file"
                continue
                ;;
            esac
            if head -n 20 -- "$file" | grep -qE 'GOS3'; then
              echo "PASS: $file"
            else
              echo "FAIL: missing GOS3 header: $file"
              failures=$((failures + 1))
            fi
          done

          if (( failures > 0 )); then
            echo "check-headers: FAIL ($failures file(s))"
            exit 1
          fi
          echo "check-headers: PASS"

  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Governance policy gate
        run: python3 tests/change_validation_policy_test.py
      - name: Gate 1
        run: python3 tests/contract_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Node dependencies
        run: npm install
      - name: Gate 2 — multi-agent E2E
        run: npm run test:gos3:multiagent
