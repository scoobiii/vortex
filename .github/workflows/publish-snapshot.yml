name: GOS3 Compliance + Snapshot
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/scrape_repo.py . --git-meta --out snapshot.md
      - run: |
          git config user.name "scoobiii"
          git config user.email "sobrinhosjs@gmail.com"
          git fetch origin gh-pages:gh-pages || true
          git checkout gh-pages || git checkout -- orphan gh-pages
          cp ../../../../../..//../../../../snapshot.md ./ || cp $GITHUBIWORKSPACE/snapshot.md ./
          ls -lh snapshot.md
          git add snapshot.md
          git commit -m "chore: publish snapshot ${{ github.sha }}" || echo "no change"
          git push origin gh-pages
