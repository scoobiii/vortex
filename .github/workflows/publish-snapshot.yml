name: Publish snapshot (GitHub Pages)

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar snapshot público (JSON + Markdown, com metadados git)
        run: |
          mkdir -p public
          python3 scrape_repo.py . --out public/snapshot.md \
            --ext .md,.ts,.json --git-meta
          python3 scrape_repo.py . --out public/snapshot.json --json \
            --ext .md,.ts,.json

          {
            echo "# Hashes (sha256, gerado no CI)"
            echo "Gerado em (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            find . -type f \( -name '*.md' -o -name '*.ts' -o -name '*.json' \) \
              -not -path './node_modules/*' -not -path './.git/*' -not -path './public/*' \
              -exec sha256sum {} \;
          } > public/hashes.txt

          cat > public/index.md << 'EOF'
          # Vortex / GOS3 — snapshot público

          Gerado automaticamente a cada push em `main`.

          - [snapshot.md](./snapshot.md)
          - [snapshot.json](./snapshot.json)
          - [hashes.txt](./hashes.txt)
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
