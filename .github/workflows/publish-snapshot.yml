# Vortex / GOS3 v2.4 — Fase: Discovery → Technical Refinement
# Proposto por Claude (GOS3 · NxN · Proposer) — ver docs/proposals/claude/README.md
#
# Resolve o problema de agentes sem sandbox (Meta app, GPT, etc.) que só
# conseguem HTTP fetch simples e falham quando o repo não está indexado:
# publica um snapshot estático via GitHub Pages, com URL fixa e pública,
# atualizado a cada push em main. Não depende de busca, não depende de
# sandbox do lado de quem acessa — só precisa de fetch HTTP.
name: Publish snapshot (GitHub Pages)

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar snapshot público (JSON + Markdown, com hash e timestamp)
        run: |
          mkdir -p public
          python3 scrape_repo.py --root . --out public/snapshot.md \
            --ext .md,.ts,.json \
            --include-git-meta --include-hash
          python3 scrape_repo.py --root . --out public/snapshot.json --json \
            --ext .md,.ts,.json \
            --include-hash
          # index simples pra quem chegar via navegador/fetch sem saber o path exato
          cat > public/index.md << 'EOF'
          # Vortex / GOS3 — snapshot público

          Gerado automaticamente a cada push em `main`. Fonte: git local do repo,
          não é scraping de terceiros. Ver `docs/PLAYBOOK.md` no repo original
          para o processo completo.

          - [snapshot.md](./snapshot.md) — dump legível, todo o conteúdo em um arquivo
          - [snapshot.json](./snapshot.json) — mesmo conteúdo, estruturado, com hash sha256 por arquivo
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
