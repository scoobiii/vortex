name: selix-cross-repo

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selix-over-vortex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vortex
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout SELIX model
        uses: actions/checkout@v4
        with:
          repository: scoobiii/selix
          ref: main
          path: selix-source

      - name: Install SELIX dependencies
        run: pip install -r selix-source/requirements.txt

      - name: Build official SELIX invocation input
        id: selix
        shell: bash
        run: |
          INVOCATION_JSON="$(PYTHONPATH="$GITHUB_WORKSPACE/selix-source" python - <<'PY'
          import json
          from src.selix.config import get_selic_atual_from_bcb, get_selic_ideal
          from src.selix.core import BASELINE_ATUAL

          current = get_selic_atual_from_bcb()
          if not current.get("success"):
              raise SystemExit(f"BCB lookup failed: {current}")

          payload = {
              "selic_atual": float(current["rate"]),
              "selic_ideal": float(get_selic_ideal()),
              "ipca": float(BASELINE_ATUAL.inflacao_esperada),
              "source": "scoobiii/selix@main",
              "selic_source": current["source"],
              "selic_date": current.get("data_bcb"),
          }
          print(json.dumps({
              "invocation_id": "cross-selix-vortex",
              "agent": "selix",
              "action": "selix.selic1d",
              "payload": payload,
              "context": {"sandbox": True},
          }, separators=(",", ":")))
          PY
          )"
          echo "invocation_json=$INVOCATION_JSON" >> "$GITHUB_OUTPUT"
          echo "SELIX official invocation generated from SELIX model + BCB provider"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vortex dependencies
        run: npm install

      - name: Run SELIX through Vortex
        env:
          SELIX_INVOCATION_JSON: ${{ steps.selix.outputs.invocation_json }}
        run: |
          set -euo pipefail
          npx ts-node src/agents/selix/adapter/index.ts > cross-result.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('cross-result.json', 'utf8'));
          const expected = JSON.parse(process.env.SELIX_INVOCATION_JSON);
          if (r.invocation_id !== expected.invocation_id) throw new Error('invocation_id mismatch');
          if (r.gate !== 'PASS' || r.executed !== true || r.claim !== 'executed') throw new Error('GOS3 execution gate failed');
          if (r.evidence?.exit_code !== 0 || !r.evidence?.input_hash || !r.evidence?.output_hash) throw new Error('execution proof incomplete');
          if (r.result?.selic_ideal !== expected.payload.selic_ideal) throw new Error('SELIX ideal mismatch');
          if (r.result?.ipca_proxy !== expected.payload.ipca) throw new Error('SELIX IPCA mismatch');
          if (r.result?.selic_atual !== expected.payload.selic_atual) throw new Error('market input mismatch');
          console.log('CROSS-REPO GATE: PASS');
          console.log(`SELIX source: ${expected.payload.source}`);
          console.log(`SELIX input hash: ${r.evidence.input_hash}`);
          console.log(`Vortex output hash: ${r.evidence.output_hash}`);
          NODE

      - name: Run Vortex deterministic contract gate
        env:
          SELIX_INVOCATION_JSON: ${{ steps.selix.outputs.invocation_json }}
        run: npm run test:selix --silent
