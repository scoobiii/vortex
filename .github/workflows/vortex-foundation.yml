# GOS3
# arquivo: .github/workflows/vortex-foundation.yml
# responsabilidade: gates MCP + Gateway + integração + cobertura + segurança + stress + performance + degradação + proveniência
# agente: agent/llm
# papel: Engineering Agent
# fase: implementation
# data: 2026-09-08
# hora: 18:00
# antes: baseline workflow inexistente
# depois: Foundation CI com gates obrigatórios
# base: feat/mcp-server
# assinatura: GOS3 Maintainer / Engineering Agent
# commit: generated by Codex
name: Vortex Foundation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vortex-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  COVERAGE_LINES: '100'
  COVERAGE_BRANCHES: '100'
  COVERAGE_FUNCTIONS: '100'

jobs:
  headers:
    name: foundation-headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Validate GOS3 headers on changed text files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" ]]; then BASE_SHA="$(git rev-parse HEAD^)"; fi
          mapfile -t files < <(git diff --name-only "$BASE_SHA"...HEAD)
          failures=0
          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue
            case "$file" in *.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico|*.zip|*.gz|*.tar|*.pdf|*.woff|*.woff2) continue;; esac
            if head -n 20 -- "$file" | grep -qE 'GOS3'; then echo "PASS $file"; else echo "FAIL missing GOS3 header: $file"; failures=$((failures+1)); fi
          done
          (( failures == 0 )) || exit 1

  module-conformance:
    name: ${{ matrix.module }}-conformance
    needs: headers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [mcp, gateway]
    defaults:
      run:
        working-directory: ${{ matrix.module == 'mcp' && 'vortex-mcp' || 'vortex-gateway' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.module == 'mcp' && 'vortex-mcp/package-lock.json' || 'vortex-gateway/package-lock.json' }}
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Conformance
        run: npm run test:conformance 2>&1 | tee conformance.log
      - name: 100% line/branch/function coverage
        run: |
          node --experimental-test-coverage \
            --test-coverage-lines=${COVERAGE_LINES} \
            --test-coverage-branches=${COVERAGE_BRANCHES} \
            --test-coverage-functions=${COVERAGE_FUNCTIONS} \
            --test-coverage-include='src/**/*.js' \
            --test dist/test/conformance/*.test.js 2>&1 | tee coverage.log
      - name: Dependency security audit
        run: npm audit --audit-level=high 2>&1 | tee security-audit.log
      - name: Stress + performance benchmark
        working-directory: .
        env:
          VORTEX_ROOT: ${{ github.workspace }}
        run: |
          mkdir -p evidence
          node ci/foundation-benchmark.mjs --module ${{ matrix.module }} | tee evidence/benchmark.json
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/benchmark.json'))
          assert d['error_rate'] == 0, d
          assert d['stress_errors'] == 0, d
          assert d['ops_per_sec'] > 0, d
          assert d['p95_ms'] >= 0 and d['p99_ms'] >= 0, d
          print('STRESS/PERFORMANCE: PASS')
          PY
      - name: Build execution evidence hash bound to CI
        working-directory: .
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          COMMIT_SHA="${GITHUB_SHA}"
          RUN_ID="${GITHUB_RUN_ID}"
          SUITE="vortex-foundation-ci-v1"
          TESTS_SHA="$(sha256sum "$MODULE/${{ matrix.module == 'mcp' && 'conformance.log' || 'conformance.log' }}" | awk '{print $1}')"
          COVERAGE_SHA="$(sha256sum "$MODULE/coverage.log" | awk '{print $1}')"
          BENCH_SHA="$(sha256sum evidence/benchmark.json | awk '{print $1}')"
          SECURITY_SHA="$(sha256sum "$MODULE/security-audit.log" | awk '{print $1}')"
          MATERIAL="commit=${COMMIT_SHA}\nrun_id=${RUN_ID}\nsuite=${SUITE}\nmodule=${MODULE}\ntests=${TESTS_SHA}\ncoverage=${COVERAGE_SHA}\nbenchmark=${BENCH_SHA}\nsecurity=${SECURITY_SHA}"
          EXECUTION_EVIDENCE_HASH="sha256:$(printf '%b' "$MATERIAL" | sha256sum | awk '{print $1}')"
          python3 - <<PY
          import json
          d={'schema':'vortex/execution-evidence/1','commit_sha':'$COMMIT_SHA','ci_run_id':'$RUN_ID','suite':'$SUITE','module':'$MODULE','tests_sha256':'$TESTS_SHA','coverage_sha256':'$COVERAGE_SHA','benchmark_sha256':'$BENCH_SHA','security_sha256':'$SECURITY_SHA','execution_evidence_hash':'$EXECUTION_EVIDENCE_HASH'}
          json.dump(d,open('evidence/execution-evidence.json','w'),indent=2,sort_keys=True)
          PY
          cat evidence/execution-evidence.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-${{ matrix.module }}-evidence-${{ github.run_id }}
          path: |
            ${{ matrix.module }}/conformance.log
            ${{ matrix.module }}/coverage.log
            ${{ matrix.module }}/security-audit.log
            evidence/benchmark.json
            evidence/execution-evidence.json

  degradation:
    name: degradation-and-failure
    needs: [module-conformance]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [mcp, gateway]
    defaults:
      run:
        working-directory: ${{ matrix.module == 'mcp' && 'vortex-mcp' || 'vortex-gateway' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.module == 'mcp' && 'vortex-mcp/package-lock.json' || 'vortex-gateway/package-lock.json' }}
      - run: npm ci
      - run: npm run build
      - name: Run failure/degradation conformance without masking errors
        run: npm run test:conformance
      - name: Assert timeout/error/replay paths exist in executable tests
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'timeout|replay|error|denied|tamper' test/conformance >/dev/null

  foundation-integration:
    name: foundation-real-integration
    needs: [module-conformance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install MCP
        working-directory: vortex-mcp
        run: npm ci
      - name: Install Gateway
        working-directory: vortex-gateway
        run: npm ci
      - name: Build MCP
        working-directory: vortex-mcp
        run: npm run build
      - name: Build Gateway
        working-directory: vortex-gateway
        run: npm run build
      - name: Execute real Foundation integration smoke
        run: node ci/foundation-integration.mjs
      - name: Record integration provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '%s\n' "commit=${GITHUB_SHA}" "ci_run_id=${GITHUB_RUN_ID}" "integration=foundation-real-smoke-v1" > evidence/integration-provenance.txt
          sha256sum evidence/integration-provenance.txt | tee evidence/integration-provenance.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-integration-${{ github.run_id }}
          path: evidence/

  benchmark-gate:
    name: benchmark-regression-gate
    needs: [module-conformance, foundation-integration, degradation]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [mcp, gateway]
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
      - name: Checkout base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install and build base
        working-directory: base/${{ matrix.module == 'mcp' && 'vortex-mcp' || 'vortex-gateway' }}
        run: npm ci && npm run build
      - name: Install and build PR
        working-directory: pr/${{ matrix.module == 'mcp' && 'vortex-mcp' || 'vortex-gateway' }}
        run: npm ci && npm run build
      - name: Benchmark base revision
        env:
          VORTEX_ROOT: ${{ github.workspace }}/base
        run: node pr/ci/foundation-benchmark.mjs --module ${{ matrix.module }} | tee base-${{ matrix.module }}.json
      - name: Benchmark PR revision
        env:
          VORTEX_ROOT: ${{ github.workspace }}/pr
        run: node pr/ci/foundation-benchmark.mjs --module ${{ matrix.module }} | tee head-${{ matrix.module }}.json
      - name: Enforce benchmark baseline
        run: node pr/ci/compare-benchmark.mjs base-${{ matrix.module }}.json head-${{ matrix.module }}.json
      - name: Upload benchmark comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.module }}-${{ github.run_id }}
          path: |
            base-${{ matrix.module }}.json
            head-${{ matrix.module }}.json

  merge-gate:
    name: VORTEX-FOUNDATION-MERGE-GATE
    needs: [headers, module-conformance, degradation, foundation-integration, benchmark-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Foundation gate to pass
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            '${{ needs.headers.result }}' \
            '${{ needs.module-conformance.result }}' \
            '${{ needs.degradation.result }}' \
            '${{ needs.foundation-integration.result }}'; do
            [[ "$result" == "success" ]] || { echo "Foundation gate failed: $result"; exit 1; }
          done
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            [[ '${{ needs.benchmark-gate.result }}' == 'success' ]] || { echo 'Benchmark regression gate failed'; exit 1; }
          fi
          echo 'VORTEX FOUNDATION MERGE GATE: PASS'
